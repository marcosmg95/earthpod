name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src
      - run: npm run build

  # Deploys frontend/web to https://earthpod.earth,
  # only from main and only when the backend tests and the web checks pass.
  deploy:
    needs: [test, web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install kamal --no-document
      - uses: docker/setup-buildx-action@v3
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS8_SSH_KEY }}
      - name: Trust VPS8 host key (pinned)
        run: echo "187.124.45.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPgfXzBU3teaJdmho3ZwRih+g++WGMIli8aS/evP9UGR" >> ~/.ssh/known_hosts
      - run: kamal deploy
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
