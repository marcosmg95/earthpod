# Pages change on every deploy; hashed build files never change; media can be cached for a day.
map $uri $cache_control {
    ~^/assets/                                                  "public, max-age=31536000, immutable";
    ~*\.(html|json|webmanifest)$                                "no-cache";
    ~*\.(png|jpg|jpeg|webp|svg|ico|wav|mp3|m4a|ogg|mp4|vtt)$    "public, max-age=86400";
    default                                                     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/vtt application/manifest+json;

    # kamal-proxy health check
    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # types nginx does not know; with nosniff, browsers need them exactly right
    location ~* \.vtt$ {
        default_type text/vtt;
    }
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}