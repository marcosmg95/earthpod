[project]
name = "earth-jukebox"
version = "0.1.0"
description = "Earth Jukebox backend: NASA data -> music (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0,<3", # 3.x DLLs blocked by Windows Smart App Control
    "matplotlib>=3.7",
    "opencv-python>=4.8",
    "pillow>=10",
    "requests>=2.31",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# PoC 4 only (Barcelona from the gridded file)
netcdf = ["netCDF4>=1.6"]
# PoC 5 only (Black Marble night lights, HDF5)
blackmarble = ["h5py>=3.9"]

[dependency-groups]
# SVS explorer app: uv run python -m streamlit run apps/svs_explorer.py
explorer = ["streamlit>=1.40"]

[tool.uv]
default-groups = ["explorer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jukebox"]
