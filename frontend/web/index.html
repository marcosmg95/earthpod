<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#15151b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("ej:settings") || "{}")
        var m = s.motion || "system"
        var reduce = m === "reduce" || (m === "system" && matchMedia("(prefers-reduced-motion: reduce)").matches)
        document.documentElement.dataset.motion = reduce ? "reduce" : "full"
      } catch (e) {}
    </script>
    <title>EarthPod</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
