<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Jukebox — PoC player (CCLab)</title>
<style>
  :root { --bg:#10202B; --fg:#F4F1EA; --muted:#B9C7CF; --accent:#E8925A; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.5 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px; }
  h1 { font-size:32px; margin:0 0 4px }
  p.lead { color:var(--muted); margin:0 0 24px }
  .controls { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin-bottom:16px }
  button { font:inherit; padding:10px 18px; border-radius:8px; border:2px solid var(--fg); background:transparent; color:var(--fg); cursor:pointer }
  button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#10202B }
  :focus-visible { outline:3px solid var(--accent); outline-offset:3px }
  label { display:flex; gap:8px; align-items:center }
  input[type=range] { width:220px }
  #year { width:100% }
  #status { font-size:24px; min-height:2.2em; margin:16px 0 }
  figure { margin:0 }
  img, canvas { width:100%; border-radius:8px; background:#183242 }
  #keys { color:var(--muted); font-size:16px }
  fieldset { border:1px solid #3a5466; border-radius:8px }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important } }
</style>
</head>
<body>
<main>
  <h1>Earth Jukebox <small style="font-size:18px;color:var(--muted)">proof of concept</small></h1>
  <p class="lead" id="mapping">Loading…</p>

  <div class="controls">
    <button id="play" aria-pressed="false">Play</button>
    <label>Volume <input id="vol" type="range" min="0" max="100" value="70" aria-label="Volume"></label>
    <button id="ref">Reference tone (0 °C)</button>
    <button id="describe">Describe year</button>
    <label><input id="leadOnly" type="checkbox"> Melody only</label>
  </div>

  <fieldset id="trackSet"><legend>Track</legend></fieldset>

  <p><label for="year" style="display:block">Year</label>
  <input id="year" type="range" min="0" max="0" value="0" step="1"></p>

  <div id="status" aria-live="polite" aria-atomic="true"></div>

  <figure>
    <img id="frame" alt="" hidden>
    <canvas id="chart" width="960" height="240" role="img" aria-label="Line chart of the temperature anomaly track"></canvas>
    <figcaption id="cap" style="color:var(--muted);font-size:14px">Data: NASA GISTEMP v4. Frames: NASA Scientific Visualization Studio (SVS 5450). Not endorsed by NASA.</figcaption>
  </figure>

  <p id="keys">Keys: Space play/pause · ←/→ year · Shift+←/→ decade · R reference tone · D describe · B switch track · M melody only</p>
</main>
<script>
"use strict";
let DATA, track, key, idx = 0, playing = false, ctx, master, drone, timer, nextTime = 0, lastSpoken = 0;
const $ = id => document.getElementById(id);
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

async function init() {
  try { DATA = await (await fetch("tracks.json")).json(); }
  catch (e) { $("mapping").textContent = "Could not load tracks.json. Run: python -m http.server (in the web folder)"; return; }
  const keys = Object.keys(DATA.tracks);
  keys.forEach((k, i) => {
    const l = document.createElement("label");
    l.innerHTML = `<input type="radio" name="track" value="${k}" ${i ? "" : "checked"}> ${DATA.tracks[k].name}`;
    $("trackSet").appendChild(l);
  });
  $("trackSet").addEventListener("change", e => selectTrack(e.target.value));
  selectTrack(keys[0]);
}

const DEFAULT_CAPTION = $("cap").textContent, DEFAULT_CHART = $("chart").getAttribute("aria-label");
const refOf = () => track.reference || { midi: 50, label: "Reference: 0 °C, the 1951 to 1980 average" };

function selectTrack(k) {
  if (playing) stop();
  key = k; track = DATA.tracks[k];
  $("mapping").textContent = track.mapping;
  $("cap").textContent = track.caption || DEFAULT_CAPTION;
  $("chart").setAttribute("aria-label", track.chart_label || DEFAULT_CHART);
  $("ref").textContent = track.reference ? "Reference tone (2012 level)" : "Reference tone (0 °C)";
  $("year").max = track.years.length - 1;
  idx = Math.min(idx, track.years.length - 1);
  document.querySelector(`input[value="${k}"]`).checked = true;
  show(true);
}

function show(announce) {
  const y = track.years[idx];
  $("year").value = idx;
  $("year").setAttribute("aria-valuetext", y.description);
  if (y.frame != null) { const img = $("frame"); img.hidden = false; img.src = `frames/frame_${String(y.frame).padStart(3, "0")}.png`; img.alt = y.description; img.onerror = () => img.hidden = true; }
  else $("frame").hidden = true;
  drawChart();
  if (announce) say(y.description);
}

function say(text) {          // live region + duck the music under screen-reader speech
  $("status").textContent = text;
  if (master && playing) { const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(vol() * 0.35, t, 0.05); master.gain.setTargetAtTime(vol(), t + 1.8, 0.3); }
}

function drawChart() {
  const c = $("chart"), g = c.getContext("2d"), Y = track.years;
  const v = Y.map(y => Object.values(y.values)[0]), lo = Math.min(...v, 0), hi = Math.max(...v);
  const X = i => 20 + i / (Y.length - 1) * (c.width - 40), Yp = x => c.height - 20 - (x - lo) / (hi - lo) * (c.height - 40);
  g.clearRect(0, 0, c.width, c.height);
  g.strokeStyle = "#3a5466"; g.beginPath(); g.moveTo(20, Yp(0)); g.lineTo(c.width - 20, Yp(0)); g.stroke();
  g.strokeStyle = "#E8925A"; g.lineWidth = 2; g.beginPath(); v.forEach((x, i) => i ? g.lineTo(X(i), Yp(x)) : g.moveTo(X(i), Yp(x))); g.stroke();
  g.fillStyle = "#F4F1EA"; g.beginPath(); g.arc(X(idx), Yp(v[idx]), 6, 0, 7); g.fill();
}

const vol = () => $("vol").value / 100 * 0.8;

function ensureAudio() {         // AudioContext only after a user gesture (WCAG 1.4.2: no autoplay)
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = vol();
  const comp = ctx.createDynamicsCompressor(); master.connect(comp).connect(ctx.destination);
}

function voiceNote(midi, t, dur, kind, gain, pan) {
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  const g = ctx.createGain(); g.gain.value = 0;
  g.connect(p).connect(master);
  const f = midiHz(midi);
  const attack = kind === "string" ? 0.2 : 0.005;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack);
  g.gain.setTargetAtTime(0, t + (kind === "pluck" ? 0.05 : dur * 0.7), kind === "bell" ? 0.6 : 0.15);
  const parts = kind === "bell" ? [[1, 1], [2.76, .4], [5.4, .2]] : [[1, 1]];
  parts.forEach(([m, a]) => {
    const o = ctx.createOscillator(); o.type = kind === "string" ? "sawtooth" : kind === "bell" ? "sine" : "triangle";
    o.frequency.value = f * m;
    let node = o;
    if (kind === "string") { const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1800; o.connect(lp); node = lp; }
    const ga = ctx.createGain(); ga.gain.value = a * (kind === "string" ? 0.25 : 1);
    node.connect(ga).connect(g); o.start(t); o.stop(t + dur + 2);
  });
}

function scheduleYear(y, t) {
  const lead = $("leadOnly").checked, vs = track.voices;
  vs.forEach((v, i) => {
    if (y.midi[v.name] == null || (lead && i > 0)) return;
    voiceNote(y.midi[v.name], t, y.dur * (i ? 1.6 : 0.9), v.timbre, v.gain * 0.3, v.pan);
  });
  const g = y.midi[vs[0].name];
  if (y.dissonant) voiceNote(g + 6, t, y.dur * 0.9, "pluck", 0.08, 0.1);
  if (y.record) voiceNote(g + 24, t, y.dur * 3, "bell", 0.1, 0);
}

function tick() {                // lookahead scheduler
  while (playing && nextTime < ctx.currentTime + 0.25) {
    const y = track.years[idx];
    scheduleYear(y, nextTime);
    const at = nextTime, i = idx;
    setTimeout(() => { if (!playing) return; idx = i; show(false);
      if (y.record || y.year % 10 === 0) say(y.description); }, Math.max(0, (at - ctx.currentTime) * 1000));
    nextTime += y.dur;
    if (idx >= track.years.length - 1) { setTimeout(stop, (nextTime - ctx.currentTime) * 1000 + 1500); clearInterval(timer); break; }
    idx++;
  }
}

function startDrone() {
  drone = ctx.createOscillator(); drone.frequency.value = midiHz(track.drone_midi ?? 38);
  const g = ctx.createGain(); g.gain.value = 0.06; drone.connect(g).connect(master); drone.start();
}

function play() {
  ensureAudio(); ctx.resume();
  if (idx >= track.years.length - 1) idx = 0;
  playing = true; nextTime = ctx.currentTime + 0.1; startDrone();
  timer = setInterval(tick, 50);
  $("play").textContent = "Pause"; $("play").setAttribute("aria-pressed", "true");
}

function stop() {
  playing = false; clearInterval(timer);
  if (drone) { drone.stop(); drone = null; }
  $("play").textContent = "Play"; $("play").setAttribute("aria-pressed", "false");
  if (track) say(track.years[idx].description);
}

function step(n) { if (playing) stop(); idx = Math.max(0, Math.min(track.years.length - 1, idx + n)); show(true); preview(); }
function preview() { ensureAudio(); ctx.resume(); scheduleYear(track.years[idx], ctx.currentTime + 0.02); }
function refTone() { const r = refOf(); ensureAudio(); ctx.resume(); voiceNote(r.midi, ctx.currentTime + 0.02, 1.5, "pluck", 0.3, 0); say(r.label); }

$("play").onclick = () => playing ? stop() : play();
$("ref").onclick = refTone;
$("describe").onclick = () => say(track.years[idx].description);
$("vol").oninput = () => { $("vol").setAttribute("aria-valuetext", $("vol").value + " percent"); if (master) master.gain.value = vol(); };
$("year").oninput = () => { idx = +$("year").value; show(true); if (!playing) preview(); };

document.addEventListener("keydown", e => {
  if (!track || e.target.tagName === "INPUT" && e.target.type === "range" && e.key.startsWith("Arrow") && !e.shiftKey) return;
  const k = e.key.toLowerCase();
  if (e.key === " " && !["BUTTON", "INPUT"].includes(e.target.tagName)) { e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); step((e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 10 : 1)); }
  else if (k === "r") refTone();
  else if (k === "d") say(track.years[idx].description);
  else if (k === "m") $("leadOnly").click();
  else if (k === "b") { const ks = Object.keys(DATA.tracks); selectTrack(ks[(ks.indexOf(key) + 1) % ks.length]); }
});
init();
</script>
</body>
</html>
