# The service keeps its old name: renaming it would make kamal-proxy see a second service
# claiming earthpod.earth (run `kamal remove` for the old one first if you ever rename it).
service: nasa-arcade
image: marcosmg95/earthpod

servers:
  web:
    hosts:
      - 187.124.45.150
    options:
      memory: 128m
      cpus: 0.25

proxy:
  ssl: true
  host: earthpod.earth
  app_port: 80
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username: marcosmg95
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  dockerfile: infra/Dockerfile
  context: .
